<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requested Orders | F3: Fresh From Farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'agri-dark': '#2B1B0E',
                        'agri-gold': '#D4A017',
                        'agri-secondary': '#FFB800',
                        'agri-cream': '#FFF9E5',
                        'agri-light': '#fdfcfb',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Noto Serif', 'serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./css/theme.css">
</head>
<body class="bg-agri-light text-slate-800 font-sans dark:bg-[#2B1B0E] dark:text-agri-cream transition-colors duration-500">
    
    <!-- Sidebar Navigation -->
    <!-- Sidebar Placeholder -->
    <div id="f3-sidebar"></div>

    <!-- Main Content -->
    <main class="md:pl-72 flex flex-col min-h-screen">
        <div class="p-12 max-w-6xl mx-auto w-full">
            <header class="mb-12">
                <div class="inline-flex items-center gap-3 px-4 py-1.5 bg-agri-gold/10 rounded-full border border-agri-gold/20 mb-6">
                    <span class="w-1.5 h-1.5 bg-agri-gold rounded-full animate-pulse"></span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-agri-gold">Incoming Harvest Requests</span>
                </div>
                <h1 class="text-5xl font-serif font-black text-agri-dark dark:text-white tracking-tighter mb-4">Customer Orders</h1>
                <p class="text-slate-500 dark:text-slate-400 text-lg font-medium leading-relaxed max-w-2xl">Manage your active orders and coordinate deliveries with your customers.</p>
            </header>

            <!-- Orders Table -->
            <div class="bg-white dark:bg-slate-900 rounded-[3rem] border border-slate-100 dark:border-white/5 shadow-xl shadow-slate-200/50 dark:shadow-none overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 dark:bg-slate-800 border-b border-slate-100 dark:border-white/5 text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em]">
                        <tr>
                            <th class="px-10 py-6">Customer & Contact</th>
                            <th class="px-10 py-6">Product Ordered</th>
                            <th class="px-10 py-6">Delivery Address</th>
                            <th class="px-10 py-6">Payment</th>
                            <th class="px-10 py-6">Status</th>
                        </tr>
                    </thead>
                    <tbody id="farmer-orders-body" class="divide-y divide-slate-50 dark:divide-white/5 font-bold text-agri-dark dark:text-slate-200">
                        <!-- Orders will be loaded here -->
                        <tr>
                            <td colspan="5" class="px-10 py-20 text-center text-slate-400">
                                <div class="flex flex-col items-center gap-4">
                                    <div class="w-12 h-12 border-4 border-agri-gold border-t-transparent rounded-full animate-spin"></div>
                                    <p class="uppercase tracking-widest text-[10px] font-black">Scanning database for requests...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- F3 Shared Components -->
    <script src="./js/components/ui.js"></script>
    <script src="./js/components/sidebar.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="./js/common.js"></script>
    <script>
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const farmerEmail = localStorage.getItem('userEmail') || 'unknown@farmer.com';

        function loadFarmerOrders() {
            const body = document.getElementById('farmer-orders-body');
            
            // Real-time Order Sync
            db.collection('orders')
              .where('farmer_name', '==', farmerEmail)
              .onSnapshot((querySnapshot) => {
                if (querySnapshot.empty) {
                    body.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-10 py-20 text-center text-slate-400 font-black uppercase tracking-[0.2em] text-xs">
                                No incoming orders yet. Your products are live!
                            </td>
                        </tr>
                    `;
                    return;
                }

                const orders = [];
                querySnapshot.forEach(doc => {
                    orders.push({ id: doc.id, ...doc.data() });
                });

                // Manual sort by createdAt
                orders.sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

                body.innerHTML = orders.map(o => {
                    let actionButton = '';
                    let statusClass = 'bg-amber-100 dark:bg-amber-900/30 text-amber-700';

                    if (o.status === 'Processing') {
                        actionButton = `<button onclick="confirmOrder('${o.id}')" class="text-[9px] font-black uppercase tracking-widest text-agri-gold hover:underline">Confirm Order</button>`;
                    } else if (o.status === 'Confirmed') {
                        statusClass = 'bg-blue-100 dark:bg-blue-900/30 text-blue-700';
                        actionButton = `<button onclick="markDelivered('${o.id}', '${o.product_id}', ${o.quantity})" class="text-[9px] font-black uppercase tracking-widest text-agri-green-light hover:underline">Mark Delivered</button>`;
                    } else if (o.status === 'Delivered') {
                        statusClass = 'bg-green-100 dark:bg-green-900/30 text-green-700';
                    }

                    return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-white/5 transition-all">
                        <td class="px-10 py-6">
                            <p class="text-slate-900 dark:text-white">${o.user_email}</p>
                            <p class="text-xs text-agri-green-light font-black mt-1">${o.phone || 'No phone provided'}</p>
                        </td>
                        <td class="px-10 py-6">
                            <p>${o.product_name} <span class="text-xs text-slate-400 dark:text-slate-500 font-bold ml-2">x${o.quantity || 1}</span></p>
                            <p class="text-lg font-black text-agri-green dark:text-agri-gold mt-1">₹${o.price}</p>
                        </td>
                        <td class="px-10 py-6">
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium leading-relaxed max-w-[200px]">${o.address || 'Standard Delivery'}</p>
                        </td>
                        <td class="px-10 py-6 lowercase">
                            <span class="px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded-full text-[9px] font-black uppercase tracking-widest">${o.payment_method || 'UPI'}</span>
                        </td>
                        <td class="px-10 py-6">
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 ${statusClass} rounded-full text-[9px] font-black uppercase tracking-widest">${o.status || 'Processing'}</span>
                                ${actionButton}
                            </div>
                        </td>
                    </tr>
                `}).join('');
            }, (err) => {
                console.error('Order Sync Error:', err);
                body.innerHTML = `<tr><td colspan="5" class="px-10 py-20 text-center text-red-500 font-bold">Cloud Sync Failed.</td></tr>`;
            });
        }

        async function confirmOrder(orderId) {
            try {
                await db.collection('orders').doc(orderId).update({
                    status: 'Confirmed'
                });
                showToast('Order Confirmed! Prepare for delivery.');
            } catch (err) {
                console.error(err);
                F3Toast.error('Update failed: ' + err.message);
            }
        }

        async function markDelivered(orderId, productId, quantity) {
            try {
                // 1. Update Order Status
                await db.collection('orders').doc(orderId).update({
                    status: 'Delivered'
                });

                // 2. Update Inventory (Reduce Stock)
                if (productId) {
                    await db.collection('products').doc(productId).update({
                        quantity: firebase.firestore.FieldValue.increment(-quantity)
                    });
                }

                showToast('Success! Order delivered and inventory updated.');
            } catch (err) {
                console.error(err);
                F3Toast.error('Delivery update failed: ' + err.message);
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 z-[300] bg-agri-dark text-white px-8 py-4 rounded-2xl font-bold shadow-2xl animate-fade-in border border-white/10';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', loadFarmerOrders);
    </script>
</body>
</html>
